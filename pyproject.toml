[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ittestbot"
version = "1.0.0"
description = "Telegram Bot Quiz Scheduler with Tenant Isolation, Web Admin Panel, and Persistent Queue"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.14.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.3",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",
    "pyotp>=2.9.0",
    "qrcode>=7.4.2",
    "argon2-cffi>=23.1.0",
    "greenlet>=3.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

